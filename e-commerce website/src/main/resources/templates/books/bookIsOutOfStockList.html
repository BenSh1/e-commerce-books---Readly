<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Out of Stock</title>
    <!-- (your styles here) -->
</head>
<body>
<div class="container">
    <h1 style="color:#d9534f">Out of Stock</h1>
    <p>The following books are no longer available:</p>

    <ul>
        <li th:each="title : ${outOfStockBooks}"
            th:text="${title}">
            <!-- will be replaced by title -->
        </li>
    </ul>

    <p><a th:href="@{/ItemsForSale}">Browse other books</a></p>
    <p><a th:href="@{/cart}">return to the cart</a></p>
</div>
</body>
</html>
